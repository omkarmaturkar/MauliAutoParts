name: Build Mauli Auto Parts APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Create signing key (first build only)
        run: |
          if [ ! -f app/mauli-release.jks ]; then
            keytool -genkeypair -v -keystore app/mauli-release.jks -alias mauli \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mauli2026 -keypass mauli2026 \
              -dname "CN=Mauli Auto Parts, O=Mauli Auto Parts, C=IN"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/mauli-release.jks
            git commit -m "Add app signing key (do not delete)"
            git push origin HEAD:${{ github.ref_name }} || echo "::warning::Could not save signing key"
          fi

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk MauliAutoParts-v1.0.${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MauliAutoParts-APK
          path: MauliAutoParts-*.apk
